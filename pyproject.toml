[project]
name = "api-activity"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-restful>=0.3.10",
    "flask-talisman>=1.1.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[project.scripts]
api-activity = "api_activity:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_activity"]
